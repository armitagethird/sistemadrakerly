spring:
  application:
    name: clinica

  config:
      import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/sistemadrakerly
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  threads:
    virtual:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
